# Dollar Cost Averaging (DCA) Configuration
# Helps reduce average buy price when coins drop

# DCA enabled
DCA_enabled = true

# Conservative DCA settings
DEFAULT_DCA_A_buy_strategy = EMACROSS
DEFAULT_DCA_A_buy_value = -1.5
DEFAULT_DCA_A_buy_value_limit = -15.0

# DCA buying levels
DEFAULT_DCA_buy_trigger = -2.0
DEFAULT_DCA_max_buy_times = 5

# Progressive DCA amounts (buy more as price drops)
DEFAULT_DCA_buy_percentage_1 = 100
DEFAULT_DCA_buy_percentage_2 = 150
DEFAULT_DCA_buy_percentage_3 = 200
DEFAULT_DCA_buy_percentage_4 = 250
DEFAULT_DCA_buy_percentage_5 = 300

# DCA selling strategy
DEFAULT_DCA_A_sell_strategy = GAIN
DEFAULT_DCA_A_sell_value = 1.0

# RSI for DCA entries
DEFAULT_DCA_B_buy_strategy = RSI
DEFAULT_DCA_B_buy_value = 35
DEFAULT_DCA_B_buy_value_limit = 15

# DCA safety settings
DEFAULT_DCA_ignore_sell_only_mode = true
DEFAULT_DCA_rebuy_timeout = 10

# Stop loss for DCA positions
DEFAULT_DCA_stop_loss_trigger = -35.0
DEFAULT_DCA_stop_loss_timeout = 120